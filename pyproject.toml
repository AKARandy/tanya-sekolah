[project]
name = "sekolah-assistant"
version = "1.0.0"
description = "LLM Q&A + SPP prediction over scraped Indonesian school data (Surabaya & Sidoarjo)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F/W: core correctness. I: import order. B: bugbear. UP: modern syntax.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Graceful degradation edges: every LLM/retrieval call is wrapped so the API
# still returns raw evidence when the backend is down. Broad catches are the
# point here; narrower ones would let a new provider error type crash a route.
"app/main.py" = ["BLE001"]
"app/sql_agent.py" = ["BLE001"]
"app/build_index.py" = ["BLE001", "S110"]
"tests/test_predict.py" = ["RUF059"]
